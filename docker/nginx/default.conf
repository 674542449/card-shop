# Per-IP ceilings, sized so a normal visitor never notices. A page load pulls the HTML
# plus a handful of static files, so 30r/s with a burst of 60 is far above real use —
# but it stops one client from occupying every PHP worker, which matters more now that
# install.sh raises the worker count: without this, a larger pool just gives a single
# attacker more of the machine to hold.
limit_req_zone $binary_remote_addr zone=cardshop_req:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=cardshop_conn:10m;

server {
    listen 80;

    # Optional TLS, kept out of this file on purpose.
    #
    # `listen 443 ssl` and the certificate paths cannot live here: nginx refuses to
    # start when ssl_certificate points at a file that is not there, so committing
    # them would break every install that has no certificate yet — including a fresh
    # one on first boot.
    #
    # Instead, drop a file at docker/nginx/tls/ssl.conf (see ssl.conf.example beside
    # it) and it is picked up on restart. A wildcard include that matches nothing is
    # not an error, so the no-certificate case stays valid. That directory is
    # gitignored, so your certificate paths are yours and never conflict on pull.
    include /etc/nginx/tls/*.conf;

    server_name _;
    root /var/www/html/public;
    index index.php;

    # ---- Real client IP behind Cloudflare ----
    #
    # Without this every visitor arrives as a Cloudflare address, and everything keyed
    # on the client IP collapses into a single global bucket: the limit_req zone above,
    # Laravel's throttles, the per-IP cap of 3 unpaid orders, and the IP blacklist. The
    # symptom is not an error — the shop just starts refusing the fourth buyer.
    #
    # Safe to leave in place whether or not Cloudflare is actually in front: nginx only
    # rewrites $remote_addr when the PEER is one of the addresses listed below, so
    # someone hitting the origin directly cannot forge CF-Connecting-IP. That is why
    # this is preferable to TRUSTED_PROXIES=*, which trusts whoever connects.
    #
    # Rewriting $remote_addr here means PHP receives the real address in REMOTE_ADDR,
    # so Laravel needs no proxy configuration of its own — leave TRUSTED_PROXIES empty.
    #
    # Ranges from https://www.cloudflare.com/ips-v4 and /ips-v6, fetched 2026-08-30.
    # They change rarely; re-check after a Cloudflare announcement.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    # CF-Connecting-IP carries exactly one address that Cloudflare sets itself and
    # overwrites if the client sent one. X-Forwarded-For is a client-appendable list
    # and would need real_ip_recursive to untangle.
    real_ip_header CF-Connecting-IP;

    limit_conn cardshop_conn 24;
    limit_req zone=cardshop_req burst=60 nodelay;
    # 429 rather than nginx's default 503: it is the honest status, and it tells a
    # legitimate client (or a payment gateway retrying) that backing off will work.
    limit_req_status 429;
    limit_conn_status 429;

    charset utf-8;
    client_max_body_size 20M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Pretty URLs
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP handling.
    #
    # index.php is the ONLY script allowed to execute — it is the Laravel front
    # controller. `location =` (exact) outranks the `\.php$` regex below, so a
    # request for /index.php runs it while every OTHER .php is treated as a probe.
    location = /index.php {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 60;
    }

    # Any other .php (/wp-login.php, /xmlrpc.php, /shell.php …) is a scanner probe.
    # Instead of the old silent 404 (fastcgi to a script that does not exist), hand
    # it to the honeypot so the source IP is banned.
    location ~ \.php$ {
        try_files /honeypot-no-such-file @honeypot;
    }

    # The honeypot. Runs the Laravel front controller no matter what path was asked
    # for (SCRIPT_FILENAME forced to index.php), so TrapScanners sees the original
    # REQUEST_URI, bans the IP, and returns a plain 404 — indistinguishable from a
    # normal miss. HONEYPOT=1 is a hint for the app; the URI match is what matters.
    location @honeypot {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HONEYPOT 1;
        include fastcgi_params;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 60;
    }

    # ORDER MATTERS. nginx tries regex locations in the order they are written and
    # stops at the first match, so these must come BEFORE the static-file block below
    # — otherwise a dotted path ending in a static extension (say /.git/anything.png)
    # matches the static rule and gets served instead of trapped.
    #
    # Known scanner targets → honeypot (bans the IP + 404), not a silent deny. These
    # specific dotted paths carry nothing a real browser ever requests, so a ban here
    # cannot hit a legitimate visitor.
    location ~ /\.(env|git|svn|hg|aws|ssh)(/|$) {
        try_files /honeypot-no-such-file @honeypot;
    }

    location ~ composer\.(json|lock)$ {
        try_files /honeypot-no-such-file @honeypot;
    }

    # Other dotfiles: deny but do NOT ban. Browsers legitimately request some
    # /.well-known/* paths, so banning on the general dot rule would lock out real
    # visitors. This stays a plain 404.
    location ~ /\.ht {
        deny all;
        return 404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    # Static file caching
    #
    # The four security headers are REPEATED here on purpose. nginx's add_header is
    # inherited from the enclosing block only when the current block defines no
    # add_header of its own — so the single Cache-Control line below silently dropped
    # X-Content-Type-Options, X-Frame-Options, X-XSS-Protection and Referrer-Policy
    # from every response matching this pattern. That is every uploaded image and every
    # admin-assets bundle: exactly the files a visitor can influence the content of,
    # served without nosniff.
    location ~* \.(css|js|gif|ico|jpg|jpeg|png|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }
}
