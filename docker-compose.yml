services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: cardshop-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/var/www/html
    expose:
      - "9000"
    networks:
      - cardshop
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis

  nginx:
    image: nginx:stable
    container_name: cardshop-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    networks:
      - cardshop

  certbot:
    image: certbot/certbot
    container_name: cardshop-certbot
    restart: unless-stopped
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done'"
    networks:
      - cardshop

  postgres:
    image: postgres:17
    container_name: cardshop-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_DATABASE:-cardshop}
      POSTGRES_USER: ${DB_USERNAME:-cardshop}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-cardshop} -d ${DB_DATABASE:-cardshop}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cardshop

  redis:
    image: redis:7-alpine
    container_name: cardshop-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cardshop

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  certbot-conf:
    driver: local
  certbot-webroot:
    driver: local

networks:
  cardshop:
    driver: bridge
