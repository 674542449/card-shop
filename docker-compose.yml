services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: cardshop-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/var/www/html
    expose:
      - "9000"
    # json-file 默认不轮转，会一直长到把磁盘吃光。届时 PostgreSQL 写不下 WAL，
    # 站点整体挂掉，而 docker ps 全是 Up、应用日志干干净净，极难定位。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - cardshop
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
      # Must be a container env var, not just a .env line: bootstrap/app.php reads it
      # before .env is parsed.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      # Sized by ./install.sh from this host's CPU and RAM; the defaults here are the
      # packaged PHP-FPM values, which allow only 5 concurrent requests.
      - PHP_FPM_MAX_CHILDREN=${PHP_FPM_MAX_CHILDREN:-5}
      - PHP_FPM_START_SERVERS=${PHP_FPM_START_SERVERS:-2}
      - PHP_FPM_MIN_SPARE=${PHP_FPM_MIN_SPARE:-1}
      - PHP_FPM_MAX_SPARE=${PHP_FPM_MAX_SPARE:-3}
    healthcheck:
      test: ["CMD-SHELL", "php -r \"@fsockopen('127.0.0.1', 9000) or exit(1);\""]
      interval: 5s
      timeout: 5s
      retries: 30
      # 首次启动要在容器里装 PHP 依赖。README 把 1GB / 1 核列为最低配置，那种机器上
      # composer 解析容易接近甚至超过原来 180s 的预算，于是 `docker compose up -d`
      # 报 "app is unhealthy" 退出 —— 而容器其实还在正常跑，再执行一次就好了。
      # 新手看到这个报错会以为部署失败，从而去做各种不必要的重来。
      start_period: 300s

  # Runs Laravel's scheduler. Its only job today is releasing the cards held by
  # abandoned pending orders; without it that stock is lost permanently.
  # entrypoint is overridden so this container does not re-run migrations/seeds —
  # it waits for `app` to be healthy, by which point those have already happened.
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: cardshop-scheduler
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    entrypoint: ["php", "artisan", "schedule:work"]
    # 跟 PHP-FPM 的工作进程同一个身份（www-data，uid/gid 33）。
    # 不指定的话它以 root 跑，而它和 app 共享同一个 bind mount：跨天的第一条日志
    # 如果是它写的，storage/logs 里当天那个文件就属于 root，之后 www-data 再想往里
    # 追加就是 EACCES —— 表现为「半夜之后开始随机 500，重启一下就好」，症状和原因
    # 之间几乎没有可见联系。它启动时 app 已经 healthy，storage 的属主早就设好了。
    user: "33:33"
    # json-file 默认不轮转，会一直长到把磁盘吃光。届时 PostgreSQL 写不下 WAL，
    # 站点整体挂掉，而 docker ps 全是 Up、应用日志干干净净，极难定位。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - cardshop
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
      # Must be a container env var, not just a .env line: bootstrap/app.php reads it
      # before .env is parsed.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}

  nginx:
    image: nginx:stable
    container_name: cardshop-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      # Published unconditionally. Nothing listens on it until a config file exists in
      # docker/nginx/tls/, and an unused published port costs nothing — whereas
      # discovering the mapping is missing only after installing a certificate means
      # editing this file on the server and fighting the next git pull.
      - "443:443"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Optional TLS config; empty on a fresh install. See tls/ssl.conf.example.
      - ./docker/nginx/tls:/etc/nginx/tls:ro
      # Where the certificate itself lives on the host. Adjust the left-hand side if
      # you keep it somewhere other than /opt/cf.
      - ${TLS_CERT_DIR:-/opt/cf}:/etc/nginx/cf:ro
    # json-file 默认不轮转，会一直长到把磁盘吃光。届时 PostgreSQL 写不下 WAL，
    # 站点整体挂掉，而 docker ps 全是 Up、应用日志干干净净，极难定位。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - cardshop

  postgres:
    image: postgres:17
    container_name: cardshop-postgres
    restart: unless-stopped
    # Sized by ./install.sh. The defaults are PostgreSQL's own, which assume a machine
    # far smaller than most servers this runs on. max_connections must stay above
    # PHP_FPM_MAX_CHILDREN — every worker holds a connection, and exhausting the pool
    # surfaces as an intermittent failure that is painful to diagnose.
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE:-512MB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-4MB}
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
    # 不发布端口，理由和 redis 那边一模一样：应用通过内部的 cardshop 网络访问它，
    # 宿主机上没有任何东西需要连数据库。绑在 127.0.0.1 确实挡住了公网，但仍然把
    # 「宿主机上任意一个普通用户，或任意一次 SSRF / 命令执行」直接升级成「拿到全部
    # 订单和卡密」—— 而这个库的密码就写在同一台机器的 .env 里。
    # 需要连库时临时用：docker compose exec postgres psql -U cardshop
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_DATABASE:-cardshop}
      POSTGRES_USER: ${DB_USERNAME:-cardshop}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    healthcheck:
      # -h 127.0.0.1 forces a TCP check. Without it pg_isready uses the Unix socket and
      # reports healthy while initdb is still running, so migrations start too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DB_USERNAME:-cardshop} -d ${DB_DATABASE:-cardshop}"]
      interval: 5s
      timeout: 5s
      retries: 5
      # 没有 start_period 时，这 5 次重试从容器启动那一刻就开始计数，总共只给了 25 秒。
      # 首次部署要跑 initdb（建数据目录、写 WAL、生成系统表），在慢盘或小内存机器上
      # 超过 25 秒很常见，于是 `docker compose up` 直接以
      # "dependency failed to start: container cardshop-postgres is unhealthy" 退出 ——
      # 而 postgres 其实再过几秒就好了。start_period 内的失败不计入重试。
      start_period: 120s
    # json-file 默认不轮转，会一直长到把磁盘吃光。届时 PostgreSQL 写不下 WAL，
    # 站点整体挂掉，而 docker ps 全是 Up、应用日志干干净净，极难定位。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - cardshop

  redis:
    image: redis:7-alpine
    container_name: cardshop-redis
    restart: unless-stopped
    # 不发布端口。应用通过内部的 cardshop 网络访问它，宿主机上没有任何东西需要连
    # Redis。之前绑在 127.0.0.1 已经挡住了公网，但仍然把「宿主机上任意一个普通用户，
    # 或任意一次 SSRF / 命令执行」直接升级成「读写全部会话、进后台」——这个 Redis
    # 没有密码。不发布端口，这条路就不存在。
    # 需要调试时临时用：docker compose exec redis redis-cli
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    # json-file 默认不轮转，会一直长到把磁盘吃光。届时 PostgreSQL 写不下 WAL，
    # 站点整体挂掉，而 docker ps 全是 Up、应用日志干干净净，极难定位。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - cardshop

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  cardshop:
    driver: bridge
