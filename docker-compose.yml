services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: cardshop-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/var/www/html
    expose:
      - "9000"
    networks:
      - cardshop
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
    healthcheck:
      test: ["CMD-SHELL", "php -r \"@fsockopen('127.0.0.1', 9000) or exit(1);\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 180s

  nginx:
    image: nginx:stable
    container_name: cardshop-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - cardshop

  postgres:
    image: postgres:17
    container_name: cardshop-postgres
    restart: unless-stopped
    # Bound to loopback only. Publishing 5432 on 0.0.0.0 exposes the database to the
    # internet; the app reaches it over the internal `cardshop` network regardless.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_DATABASE:-cardshop}
      POSTGRES_USER: ${DB_USERNAME:-cardshop}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    healthcheck:
      # -h 127.0.0.1 forces a TCP check. Without it pg_isready uses the Unix socket and
      # reports healthy while initdb is still running, so migrations start too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DB_USERNAME:-cardshop} -d ${DB_DATABASE:-cardshop}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cardshop

  redis:
    image: redis:7-alpine
    container_name: cardshop-redis
    restart: unless-stopped
    # Loopback only. An internet-reachable Redis with no password is a remote code
    # execution vector, not just a data leak.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cardshop

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  cardshop:
    driver: bridge
